# Development-only dependency overrides for the n8n node CLI toolchain.
# None of these packages ship in the published node (it has no runtime dependencies).
overrides:
  "form-data": "^4.0.6"
  "qs": "^6.17.1"
  "axios@1.18.0": "1.20.0"
  "handlebars@4.7.9": "4.7.10"
  "brace-expansion@1.1.18": "1.1.21"
  "brace-expansion@5.0.9": "5.0.12"
  "@n8n/node-cli>fast-glob": "file:tools/n8n-dev-glob"
  "uuid@10.0.0": "11.1.1"
  "follow-redirects@<1.16.2": "1.16.3"
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  "stream-json@<3.7.0": "3.9.0"
  "minimatch@>=7.0.0 <11.0.1": "11.0.9"
  "glob@>=10.0.0 <14.0.2": "14.0.2"

auditConfig:
  ignoreGhsas:
    # zod <4.6.6 memory exhaustion. zod 3 is required by n8n-workflow and the
    # n8n CLI (dev tooling only; zod 4 breaks n8n-workflow). Remove when n8n
    # moves to zod >= 4.6.6.
    - GHSA-mrhx-c7xc-m3w5
